        }

            margin-top: 30px;
        }

            opacity: 0;

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
        }

            background: linear-gradient(90deg, var(--dark), #34495e);
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;

        .country-name {
            font-size: 1.4rem;
            font-weight: bold;

        .spirit-badge {

            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.9rem;

            height: 220px;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 4rem;
            position: relative;
            overflow: hidden;
        }

        .cocktail-image::before {
            content: "🍍🍹";
            animation: float 3s ease-in-out infinite;
        }

        .card-content {
            padding: 20px;
        }

        .cocktail-name {
            font-size: 1.3rem;
            color: var(--dark);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .ingredients {
            background: var(--light);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .ingredients h4 {
            color: var(--dark);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ingredients ul {
            list-style: none;
            padding-left: 0;
        }

        .ingredients li {
            padding: 5px 0;
            border-bottom: 1px dashed #ddd;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { 
                opacity: 0;
                transform: translateY(30px);
            }
            to { 
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }

            border: none;
            color: white;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;

</head>

        // 初始化页面
        function initPage() {
            generateCountryCards(cocktailsData);
            setupAnimations();
        }

        // 生成国家卡片
        function generateCountryCards(data) {
            const grid = document.getElementById('countriesGrid');
            grid.innerHTML = '';

            data.forEach((cocktail, index) => {
                const card = document.createElement('div');
                card.className = 'country-card';
                card.style.animationDelay = `${index * 0.05}s`;

                // 生成配料列表
                const ingredientsList = cocktail.ingredients.map(ing => 
                    `<li><i class="fas fa-check-circle"></i> ${ing}</li>`
                ).join('');

                card.innerHTML = `
                    <div class="card-header">
                        <div class="country-name">${cocktail.country}</div>
                        <div class="spirit-badge">${cocktail.spiritName}</div>
                    </div>
                    <div class="cocktail-image" title="${cocktail.cocktail}">
                        <!-- 图片占位符 -->
                    </div>
                    <div class="card-content">
                        <h3 class="cocktail-name">${cocktail.cocktail}</h3>
                        <p>${cocktail.description}</p>
                        <div class="ingredients">
                            <h4><i class="fas fa-list-ul"></i> 配方</h4>
                            <ul>${ingredientsList}</ul>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        // 按基酒分类筛选
        function filterBySpirit(spirit) {
            const tags = document.querySelectorAll('.spirit-tag');
            tags.forEach(tag => tag.classList.remove('active'));
            event.target.classList.add('active');

            let filteredData;
            if (spirit === 'all') {
                filteredData = cocktailsData;
            } else {
                filteredData = cocktailsData.filter(cocktail => cocktail.spirit === spirit);
            }

            generateCountryCards(filteredData);
        }

        // 搜索功能
        function searchCocktails() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            if (!searchTerm.trim()) {
                generateCountryCards(cocktailsData);
                return;
            }

            const filteredData = cocktailsData.filter(cocktail => 
                cocktail.country.toLowerCase().includes(searchTerm) ||
                cocktail.cocktail.toLowerCase().includes(searchTerm) ||
                cocktail.ingredients.some(ing => ing.toLowerCase().includes(searchTerm))
            );

            generateCountryCards(filteredData);
        }

        // 设置动画
        function setupAnimations() {
            const cards = document.querySelectorAll('.country-card');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(30px)';

                setTimeout(() => {
                    card.style.transition = 'all 0.5s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 50);
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);

        // 搜索框回车事件
        document.getElementById('searchInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchCocktails();
            }
        });
    </script>
